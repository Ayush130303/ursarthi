# Optional: run everything with Docker ->  docker compose up --build
# web http://localhost:3000   api http://localhost:8000/docs
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_DB: ursarthi, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/ursarthi
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env next to this file}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ORS_API_KEY: ${ORS_API_KEY:-}
      VECTOR_BACKEND: pgvector
    ports: ["8000:8000"]
  web:
    build: { context: ./frontend, args: { REACT_APP_API_URL: "http://localhost:8000" } }
    depends_on: [api]
    ports: ["3000:80"]
volumes:
  pgdata:
